{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="card-title">{{ post.title }}</h1>

            <div class="text-muted mb-3">
                <span>Author: {{ post.author }}</span><br>
                <span>Published: {{ post.posted.strftime('%d.%m.%Y %H:%M') }}</span><br>
                <span>Category: {{ post.category }}</span>
            </div>

            <hr>

            <div class="post-content">
                {{ post.content }}
            </div>

            <hr>

            <div class="d-flex gap-2 flex-wrap">
                <a href="{{ url_for('posts.update_post', id=post.id) }}"
                   class="btn btn-primary">
                    Edit
                </a>

                <a href="{{ url_for('posts.delete_post', id=post.id) }}"
                   class="btn btn-danger">
                    Delete
                </a>

                <a href="{{ url_for('posts.all_posts') }}"
                   class="btn btn-secondary">
                    Back to posts
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
