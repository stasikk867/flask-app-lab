<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Flask Lab 6{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('posts.static', filename='css/posts.css') }}">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('posts.all_posts') }}">
            Flask Lab 6
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('posts.all_posts') }}">
                    Posts
                </a>

                <a class="nav-link" href="{{ url_for('posts.create_post') }}">
                    Create Post
                </a>

                <a class="nav-link" href="{{ url_for('products.product_list') }}">
                    Products
                </a>

                <a class="nav-link" href="{{ url_for('main.contact') }}">
                    Contact
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }}
                            alert-dismissible fade show" role="alert">
                    {{ message }}

                    <button type="button" class="btn-close"
                            data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
