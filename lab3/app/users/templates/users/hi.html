{% extends "base.html" %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<nav>
    <ul>
        <li>
            <a href="{{ url_for('users.greetings', name='John', age=30) }}">
                Greet John
            </a>
        </li>
        <li>
            <a href="{{ url_for('users.admin') }}">Admin</a>
        </li>
    </ul>
</nav>

<h2>Hello :)</h2>

{% if age %}
    <p>User: {{ name }}</p>
    <p>Age: {{ age }}</p>
{% else %}
    <p>User: {{ name }}</p>
    <p>Age: Not provided</p>
{% endif %}
{% endblock %}
