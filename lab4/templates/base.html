
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Лабораторна робота №4{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">
            Лабораторна №4
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('home') }}">Головна</a>
            <a class="nav-link" href="{{ url_for('login') }}">Вхід</a>
            <a class="nav-link" href="{{ url_for('profile') }}">Профіль</a>
        </div>
    </div>
</nav>

<main class="container mt-4">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert
                    {% if category == 'success' %}alert-success
                    {% elif category == 'error' %}alert-danger
                    {% else %}alert-info{% endif %}
                    alert-dismissible fade show"
                    role="alert">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Закрити">
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
